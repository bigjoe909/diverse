<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d20">
    <meta name="description" content="Sign in to your DI-VERSE account.">
    <link rel="stylesheet" href="style.css">
    <title>Sign in | DI-VERSE</title>
</head>
<body>
    <main class="page">
        <a class="brand" href="#" aria-label="DI-VERSE home">
            <span class="brand-mark" aria-hidden="true">D</span>
            <span>DI-VERSE</span>
        </a>

        <section class="login-card" aria-labelledby="login-title">
            <div class="card-heading" id="login-heading">
                <span class="eyebrow">WELCOME BACK</span>
                <h1 id="login-title">Sign in to your universe</h1>
                <p>Pick up right where you left off.</p>
            </div>

            <form id="login-form">
                <label for="email">Email address</label>
                <div class="input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                        <path d="m4 7 8 6 8-6"></path>
                    </svg>
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="password-heading">
                    <label for="password">Password</label>
                    <a href="#forgot-password" data-notice="Password recovery isn't connected yet.">Forgot password?</a>
                </div>
                <div class="input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <rect x="4" y="10" width="16" height="11" rx="3"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>
                    <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button class="visibility-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                        <svg aria-hidden="true" viewBox="0 0 24 24">
                            <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="2.5"></circle>
                        </svg>
                    </button>
                </div>

                <label class="remember-option" for="remember">
                    <input id="remember" name="remember" type="checkbox">
                    <span class="custom-checkbox" aria-hidden="true"></span>
                    <span>Remember me</span>
                </label>

                <button class="submit-button" type="submit">
                    Sign in
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <form id="signup-form" class="is-hidden">
                <label for="signup-name">Your name</label>
                <div class="input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21a8 8 0 0 1 16 0"></path>
                    </svg>
                    <input id="signup-name" name="name" type="text" placeholder="How should we call you?" autocomplete="name" required>
                </div>

                <label for="signup-email" class="signup-field-label">Email address</label>
                <div class="input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                        <path d="m4 7 8 6 8-6"></path>
                    </svg>
                    <input id="signup-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <label for="signup-password" class="signup-field-label">Create a password</label>
                <div class="input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <rect x="4" y="10" width="16" height="11" rx="3"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>
                    <input id="signup-password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                </div>

                <label for="signup-confirm" class="signup-field-label">Confirm password</label>
                <div class="input-wrap">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <rect x="4" y="10" width="16" height="11" rx="3"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    </svg>
                    <input id="signup-confirm" name="confirm-password" type="password" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                </div>

                <label class="remember-option terms-option" for="terms">
                    <input id="terms" name="terms" type="checkbox" required>
                    <span class="custom-checkbox" aria-hidden="true"></span>
                    <span>I agree to the terms and privacy policy.</span>
                </label>

                <button class="submit-button" type="submit">
                    Create account
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

            <p class="signup-prompt" id="login-prompt">New to DI-VERSE?
                <a href="#signup" id="show-signup">Create an account</a>
            </p>
            <p class="signup-prompt is-hidden" id="signup-prompt">Already have an account?
                <a href="#login" id="show-login">Sign in</a>
            </p>
            <p class="signup-prompt"><a href="admin.html">Admin access</a></p>
        </section>

        <footer class="page-footer">
            <span>© 2026 DI-VERSE</span>
            <span class="footer-note"><span aria-hidden="true"></span>Your next adventure awaits</span>
        </footer>
    </main>
    <script src="auth-service.js"></script>
    <script src="script.js"></script>
</body>
</html>
